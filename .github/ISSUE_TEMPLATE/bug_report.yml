name: Bug report
description: Something in the app doesn't work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        This issue is public. Leave out anything you wouldn't want posted, such as custom-slot
        names or recipe settings; if it matters, email it to hello@bevier.cloud instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Connect the camera
        2. ...
  - type: input
    id: camera
    attributes:
      label: Camera model and firmware
      description: From the camera's own menu. Leave blank if no camera was involved.
      placeholder: X-T50, firmware 1.32
  - type: input
    id: device
    attributes:
      label: iPhone or iPad, and iOS version
      placeholder: iPhone 16 Pro, iOS 26.1
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: App version
      description: Shown in Settings ▸ About, or the commit you built from.
    validations:
      required: true
