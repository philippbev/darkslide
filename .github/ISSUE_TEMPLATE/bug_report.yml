name: Bug report
description: Something in the app doesn't work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Camera Compatibility Reports and the Connection Log are welcome here. A report replaces the
        camera's serial number with a hash keyed to your phone, which nobody else can turn back into
        the serial. Read a report before you post it: it shows your custom-slot names and recipe
        settings, and anything you typed into a Camera Test, and this issue is public.

        If the serial hash line in the text report doesn't end in "(keyed to this phone)", the report
        came from an older version of the app. Update the app and share it again, or email it to
        fujicookbook@grovehouse.xyz instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Connect the camera
        2. ...
  - type: input
    id: camera
    attributes:
      label: Camera model and firmware
      description: From the camera's own menu. Leave blank if no camera was involved.
      placeholder: X-T50, firmware 1.32
  - type: input
    id: device
    attributes:
      label: iPhone or iPad, and iOS version
      placeholder: iPhone 16 Pro, iOS 26.1
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: App version
      description: Shown in Settings ▸ About, or the commit you built from.
    validations:
      required: true
